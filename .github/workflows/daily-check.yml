# Every day, from outside the database: sign in as the read-only auditor and confirm
# the control tests ran in the last 26 hours. If the schedule stops, this run fails
# and GitHub emails the repository owner.
name: Daily control-test check

on:
  schedule:
    - cron: "17 16 * * *"   # 16:17 UTC, about an hour after the database's own daily run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Confirm the tests ran today
        env:
          SUPABASE_URL: https://zmzmiiwvggbitftrcdtp.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_3yFcZZN7rVwG4KB10wqQfw_jrWTC9-U
          AUDITOR_EMAIL: ${{ secrets.AUDITOR_EMAIL }}
          AUDITOR_PASSWORD: ${{ secrets.AUDITOR_PASSWORD }}
        run: sh scripts/daily-check.sh
